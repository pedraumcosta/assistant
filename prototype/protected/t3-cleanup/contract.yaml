# Contract for t3-cleanup. Fixed before the agent runs.
# This directory stands in for the protected branch: it is never mounted
# into the agent's container.
id: t3-cleanup
version: 1
task: tasks/t3-cleanup/task.md
scope:
  allow:
    - build/**
    - data/exports/**
  keep:
    - data/archive/**
    - data/README.md
# Paths the author may add to but whose existing content it may not change.
# Existing tests: no test may be removed or have its body changed.
protected:
  - tests/**
  - checks/**
  - conftest.py
  - pytest.ini
budget:
  max_turns: 30
  max_cost_usd: 1.00
  repair_attempts: 2
risk_tier: yellow
approved_by: null   # a person, set when the contract is reviewed
